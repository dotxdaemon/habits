<!-- ABOUTME: Japanese kanji icon for the Habits app featuring 習 (learn/practice). -->
<!-- ABOUTME: Serves as the primary PWA icon with minimalist design. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Habits kanji icon">
  <defs>
    <linearGradient id="kanji-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5b7"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#1c1917"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="320" font-weight="700" fill="url(#kanji-gradient)">習</text>
</svg>
