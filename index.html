    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");

    .mono {

    #root {

    .header-panel {

    .mini-bar-fill {

    input, select {

    .modal-overlay {

        0 8px 25px rgba(255, 107, 157, 0.4),

    .add-btn:hover {
      transform: scale(1.08);

        0 12px 35px rgba(255, 107, 157, 0.5),

    .type-btn {
      flex: 1;

    .type-btn.active {
      background: linear-gradient(135deg, #ff6b9d, #ff8a80);

    }

    .type-btn:not(.active) {
      background: rgba(255, 107, 157, 0.1);

    .submit-btn {
      width: 100%;
      padding: 18px;

      transition: all 0.2s ease;

      cursor: pointer;

      transition: all 0.2s ease;

    }

    }

  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    
    const STORAGE_KEY = 'habit-tracker-data';
    const SYNC_QUERY_PARAM = 'data';
    
    const normalizeData = (raw) => {
      const safeHabits = Array.isArray(raw?.habits) ? raw.habits.filter(Boolean) : [];
      const safeLogs = raw && typeof raw.logs === 'object' && !Array.isArray(raw.logs) ? raw.logs : {};
      return { habits: safeHabits, logs: safeLogs };
    };
    
    const encodeDataForShare = (payload) => {
      try {
        return btoa(unescape(encodeURIComponent(JSON.stringify(normalizeData(payload)))));
      } catch (e) {
        console.error('Failed to encode data for sharing:', e);
        return '';
      }
    };
    
    const decodeSharedData = (token) => {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(token))));
      return normalizeData(parsed);
    };
    
    const getSharedDataFromQuery = () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get(SYNC_QUERY_PARAM);
      if (!token) return null;
      
      try {
        const imported = decodeSharedData(token);
        params.delete(SYNC_QUERY_PARAM);
        const cleanedQuery = params.toString();
        const nextUrl = `${window.location.pathname}${cleanedQuery ? `?${cleanedQuery}` : ''}${window.location.hash}`;
        window.history.replaceState({}, '', nextUrl);
        return imported;
      } catch (e) {
        console.error('Failed to import shared data:', e);
        return null;
      }
    };
    
    const buildShareLink = (payload) => {
      const token = encodeDataForShare(payload);
      if (!token) return window.location.href.split('?')[0];
      return `${window.location.origin}${window.location.pathname}?${SYNC_QUERY_PARAM}=${encodeURIComponent(token)}`;
    };
    
    const extractShareToken = (input) => {
      if (!input) throw new Error('No sync payload provided');
      
      try {
        const maybeUrl = new URL(input);
        const token = maybeUrl.searchParams.get(SYNC_QUERY_PARAM);
        if (token) return token;
      } catch (e) {
        // Not a URL; fall through to treat the input as a token.
      }
      
      return input;
    };
    
    // Simple icon components using Lucide
    const Icon = ({ name, size = 24, className = '' }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          const icon = lucide.icons[name];
          if (icon) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            svg.innerHTML = icon[2];
            ref.current.appendChild(svg);
          }
        }
      }, [name, size]);
      return <span ref={ref} className={className} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
    };
    
    const getDateKey = (date = new Date()) => {
      return date.toISOString().split('T')[0];
    };
    
    const getDaysAgo = (n) => {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return getDateKey(d);
    };
    
    const formatDate = (dateKey) => {
      const date = new Date(dateKey + 'T12:00:00');
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    };
    
    const loadData = () => {
      const sharedData = getSharedDataFromQuery();
      if (sharedData) {
        saveData(sharedData);
        return sharedData;
      }
      
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
          return normalizeData(JSON.parse(data));
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
      return { habits: [], logs: {} };
    };
    
    const saveData = (data) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizeData(data)));
      } catch (e) {
        console.error('Failed to save data:', e);
      }
    };
    
    function HabitTracker() {
      const [data, setData] = useState(() => loadData());
      const [view, setView] = useState('today');
      const [showAddHabit, setShowAddHabit] = useState(false);
      const [newHabit, setNewHabit] = useState({ name: '', type: 'checkbox', target: 1, unit: '' });
      const [showSync, setShowSync] = useState(false);
      const [importValue, setImportValue] = useState('');
      const [copyStatus, setCopyStatus] = useState('');
      const [importError, setImportError] = useState('');
      
      const { habits, logs } = data;
      const today = getDateKey();
      
      useEffect(() => {
        saveData(data);
      }, [data]);
      
      const updateData = (updater) => {
        setData(prev => {
          const next = updater(prev);
          return normalizeData(next);
        });
      };
      
      const shareLink = useMemo(() => buildShareLink(data), [data]);
      
      const copyShareLink = async () => {
        setCopyStatus('');
        try {
          await navigator.clipboard.writeText(shareLink);
          setCopyStatus('Copied link to clipboard');
        } catch (e) {
          console.error('Failed to copy link:', e);
          setCopyStatus('Copy failed. Select and copy manually.');
        }
      };
      
      const importSharedInput = () => {
        if (!importValue.trim()) {
          setImportError('Paste a sync link or token to import.');
          return;
        }
        
        try {
          const token = extractShareToken(importValue.trim());
          const imported = decodeSharedData(token);
          setData(imported);
          setImportError('');
          setShowSync(false);
          setImportValue('');
        } catch (e) {
          console.error('Failed to import shared data:', e);
          setImportError('Invalid sync link or payload.');
        }
      };
      
      const calculateStreak = (habitId) => {
        let streak = 0;
        let checkDate = new Date();
        
        const habit = habits.find(h => h.id === habitId);
        if (!habit) return 0;
        
        const isComplete = (log) => {
          if (!log) return false;
          if (habit.type === 'checkbox') return log.done;
          return (log.value || 0) >= habit.target;
        };
        
        const todayLog = logs[today]?.[habitId];
        if (!isComplete(todayLog)) {
          checkDate.setDate(checkDate.getDate() - 1);
        }
        
        while (true) {
          const dateKey = getDateKey(checkDate);
          const log = logs[dateKey]?.[habitId];
          
          if (isComplete(log)) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
          
          if (streak > 365) break;
        }
        
        return streak;
      };
      
      const addHabit = () => {
        if (!newHabit.name.trim()) return;
        
        const habit = {
          id: Date.now().toString(),
          name: newHabit.name.trim(),
          type: newHabit.type,
          target: newHabit.type === 'amount' ? Number(newHabit.target) || 1 : 1,
          unit: newHabit.type === 'amount' ? newHabit.unit.trim() : '',
          createdAt: today
        };
        
        updateData(prev => ({
          ...prev,
          habits: [...prev.habits, habit]
        }));
        
        setNewHabit({ name: '', type: 'checkbox', target: 1, unit: '' });
        setShowAddHabit(false);
      };
      
      const deleteHabit = (habitId) => {
        updateData(prev => ({
          ...prev,
          habits: prev.habits.filter(h => h.id !== habitId)
        }));
      };
      
      const toggleCheckbox = (habitId, dateKey = today) => {
        updateData(prev => ({
          ...prev,
          logs: {
            ...prev.logs,
            [dateKey]: {
              ...prev.logs[dateKey],
              [habitId]: {
                ...prev.logs[dateKey]?.[habitId],
                done: !prev.logs[dateKey]?.[habitId]?.done
              }
            }
          }
        }));
      };
      
      const updateAmount = (habitId, delta, dateKey = today) => {
        updateData(prev => {
          const currentValue = prev.logs[dateKey]?.[habitId]?.value || 0;
          const newValue = Math.max(0, currentValue + delta);
          return {
            ...prev,
            logs: {
              ...prev.logs,
              [dateKey]: {
                ...prev.logs[dateKey],
                [habitId]: {
                  ...prev.logs[dateKey]?.[habitId],
                  value: newValue
                }
              }
            }
          };
        });
      };
      
      const getCompletionRate = (habitId, days = 30) => {
        const habit = habits.find(h => h.id === habitId);
        if (!habit) return 0;
        
        let completed = 0;
        let total = 0;
        
        for (let i = 0; i < days; i++) {
          const dateKey = getDaysAgo(i);
          if (dateKey < habit.createdAt) break;
          
          total++;
          const log = logs[dateKey]?.[habitId];
          
          if (habit.type === 'checkbox' && log?.done) completed++;
          if (habit.type === 'amount' && (log?.value || 0) >= habit.target) completed++;
        }
        
        return total > 0 ? Math.round((completed / total) * 100) : 0;
      };
      
      const getLast7Days = () => {
        return Array.from({ length: 7 }, (_, i) => getDaysAgo(6 - i));
      };
      
      return (
        <div className="page-shell">
          {/* Header */}
          <div className="header-panel" style={{ marginBottom: '28px' }}>
            <div className="header-content">
              <p className="title-jp" style={{ marginBottom: '10px' }}>習慣トラッカー</p>
              <h1 style={{
                fontSize: '38px',
                fontWeight: 900,
                background: 'linear-gradient(135deg, #ff6b9d, #ffb74d, #00d4ff)',
                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent',
                backgroundClip: 'text',
                letterSpacing: '-0.03em',
                textShadow: '0 6px 30px rgba(0, 0, 0, 0.35)'
              }}>Habits</h1>
              <p className="mono" style={{ color: '#c9a0b0', fontSize: '13px', marginTop: '12px', letterSpacing: '0.04em' }}>{formatDate(today)}</p>
            </div>
          </div>
          
          {/* Navigation */}
          <div style={{ marginBottom: '32px' }}>
            <div className="nav-shell" style={{ display: 'flex', gap: '8px' }}>
              <button 
                onClick={() => setView('today')} 
                className={`nav-btn ${view === 'today' ? 'active' : ''}`}
                style={{ flex: 1 }}
              >
                <Icon name="check" size={16} /> Today
              </button>
              <button 
                onClick={() => setView('history')} 
                className={`nav-btn ${view === 'history' ? 'active' : ''}`}
                style={{ flex: 1 }}
              >
                <Icon name="trending-up" size={16} /> Trends
              </button>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '10px', marginTop: '10px', color: '#6a5060', fontSize: '12px' }}>
              <span style={{ lineHeight: 1.5 }}>Data is saved on this device. Share a sync link to copy it elsewhere.</span>
              <button
                data-sync-trigger
                onClick={() => { setShowSync(true); setCopyStatus(''); setImportError(''); }}
                className="type-btn"
                style={{ padding: '10px 14px', display: 'inline-flex', alignItems: 'center', gap: '8px' }}
              >
                <Icon name="share-2" size={16} /> Sync devices
              </button>
            </div>
          </div>
          
          {/* Today View */}
          {view === 'today' && (
            <div className="card-stack">
              {habits.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '64px 0', color: '#8a7080' }}>
                  <div style={{ color: '#ff6b9d', opacity: 0.4, marginBottom: '16px' }}>
                    <Icon name="calendar" size={48} />
                  </div>
                  <p style={{ fontSize: '15px', fontWeight: 500 }}>まだ習慣がありません</p>
                  <p style={{ fontSize: '12px', marginTop: '6px', color: '#6a5060' }}>Add one to get started</p>
                </div>
              ) : (
                habits.map(habit => {
                  const streak = calculateStreak(habit.id);
                  const log = logs[today]?.[habit.id];
                  const isComplete = habit.type === 'checkbox' 
                    ? log?.done 
                    : (log?.value || 0) >= habit.target;
                  
                  return (
                    <div key={habit.id} className="habit-card" style={{ borderRadius: '16px', padding: '20px 24px' }}>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                            <h3 style={{
                              fontWeight: 700,
                              fontSize: '16px',
                              color: isComplete ? '#ff6b9d' : '#f5e6d3',
                              overflow: 'hidden',
                              textOverflow: 'ellipsis',
                              whiteSpace: 'nowrap',
                              letterSpacing: '-0.01em',
                              textShadow: isComplete ? '0 0 20px rgba(255, 107, 157, 0.3)' : 'none'
                            }}>
                              {habit.name}
                            </h3>
                            {streak > 0 && (
                              <div style={{ display: 'flex', alignItems: 'center', gap: '6px', color: '#ff6b9d', flexShrink: 0 }}>
                                <span className={streak >= 7 ? 'streak-glow' : ''}>
                                  <Icon name="flame" size={18} />
                                </span>
                                <span className="streak-number">{streak}</span>
                              </div>
                            )}
                          </div>
                          {habit.type === 'amount' && (
                            <p className="mono" style={{ fontSize: '12px', color: '#8a7080', marginTop: '6px', letterSpacing: '0.02em' }}>
                              {log?.value || 0} / {habit.target} {habit.unit}
                            </p>
                          )}
                        </div>
                        
                        <div style={{ display: 'flex', alignItems: 'center', gap: '16px', marginLeft: '16px' }}>
                          {habit.type === 'checkbox' ? (
                            <div 
                              onClick={() => toggleCheckbox(habit.id)}
                              className={`checkbox-custom ${log?.done ? 'checked' : ''}`}
                            >
                              {log?.done && <Icon name="check" size={18} />}
                            </div>
                          ) : (
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                              <button 
                                onClick={() => updateAmount(habit.id, -1)}
                                className="amount-btn"
                              >
                                <Icon name="minus" size={16} />
                              </button>
                              <span className="mono" style={{
                                width: '40px',
                                textAlign: 'center',
                                fontWeight: 600,
                                fontSize: '18px',
                                color: isComplete ? '#ff6b9d' : '#c9a0b0',
                                textShadow: isComplete ? '0 0 10px rgba(255, 107, 157, 0.4)' : 'none'
                              }}>
                                {log?.value || 0}
                              </span>
                              <button 
                                onClick={() => updateAmount(habit.id, 1)}
                                className="amount-btn"
                              >
                                <Icon name="plus" size={16} />
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
          
          {/* History/Trends View */}
          {view === 'history' && (
            <div className="card-stack" style={{ gap: '20px' }}>
              {habits.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '64px 0', color: '#8a7080' }}>
                  <div style={{ color: '#ff6b9d', opacity: 0.4, marginBottom: '16px' }}>
                    <Icon name="trending-up" size={48} />
                  </div>
                  <p style={{ fontSize: '14px' }}>データがまだありません</p>
                </div>
              ) : (
                habits.map(habit => {
                  const streak = calculateStreak(habit.id);
                  const rate = getCompletionRate(habit.id);
                  const last7 = getLast7Days();
                  
                  return (
                    <div key={habit.id} className="habit-card" style={{ borderRadius: '16px', padding: '24px' }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '20px' }}>
                        <div>
                          <h3 style={{ fontWeight: 700, fontSize: '16px', color: '#f5e6d3', letterSpacing: '-0.01em' }}>{habit.name}</h3>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '20px', marginTop: '12px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', color: '#ff6b9d' }}>
                              <Icon name="flame" size={18} />
                              <span className="streak-number" style={{ fontSize: '26px' }}>{streak}</span>
                              <span style={{ fontSize: '13px', color: '#c9a0b0', marginLeft: '2px' }}>日連続</span>
                            </div>
                            <div className="mono" style={{ fontSize: '13px', color: '#8a7080', letterSpacing: '0.02em' }}>
                              {rate}% <span style={{ opacity: 0.7 }}>30日</span>
                            </div>
                          </div>
                        </div>
                        <button
                          onClick={() => deleteHabit(habit.id)}
                          className="delete-btn"
                        >
                          <Icon name="trash-2" size={18} />
                        </button>
                      </div>
                      
                      {/* Mini chart */}
                      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: '6px', height: '40px' }}>
                        {last7.map(dateKey => {
                          const log = logs[dateKey]?.[habit.id];
                          let fillPercent = 0;
                          
                          if (habit.type === 'checkbox') {
                            fillPercent = log?.done ? 100 : 0;
                          } else {
                            fillPercent = Math.min(100, ((log?.value || 0) / habit.target) * 100);
                          }
                          
                          const isToday = dateKey === today;
                          
                          return (
                            <div key={dateKey} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px' }}>
                              <div className="mini-bar" style={{ width: '100%', height: '28px', borderRadius: '4px' }}>
                                <div className="mini-bar-fill" style={{ height: `${fillPercent}%`, borderRadius: '4px' }} />
                              </div>
                              <span className="mono" style={{ fontSize: '10px', color: isToday ? '#ff6b9d' : '#6a5060', fontWeight: isToday ? 600 : 400 }}>
                                {new Date(dateKey + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'narrow' })}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
          
          {/* Add Habit Modal */}
          {showAddHabit && (
            <div className="modal-overlay" onClick={() => setShowAddHabit(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ padding: '28px' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
                  <div>
                    <p style={{ fontSize: '11px', color: '#ff6b9d', letterSpacing: '0.2em', marginBottom: '6px', opacity: 0.8 }}>新しい習慣</p>
                    <h2 style={{ fontSize: '22px', fontWeight: 900, color: '#f5e6d3', letterSpacing: '-0.02em' }}>New Habit</h2>
                  </div>
                  <button onClick={() => setShowAddHabit(false)} className="icon-btn">
                    <Icon name="x" size={24} />
                  </button>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <input
                    type="text"
                    placeholder="Habit name"
                    value={newHabit.name}
                    onChange={e => setNewHabit({ ...newHabit, name: e.target.value })}
                    style={{ width: '100%' }}
                    autoFocus
                  />
                  
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button
                      onClick={() => setNewHabit({ ...newHabit, type: 'checkbox' })}
                      className={`type-btn ${newHabit.type === 'checkbox' ? 'active' : ''}`}
                    >
                      Checkbox
                    </button>
                    <button
                      onClick={() => setNewHabit({ ...newHabit, type: 'amount' })}
                      className={`type-btn ${newHabit.type === 'amount' ? 'active' : ''}`}
                    >
                      Amount
                    </button>
                  </div>
                  
                  {newHabit.type === 'amount' && (
                    <div style={{ display: 'flex', gap: '12px' }}>
                      <input
                        type="number"
                        placeholder="Target"
                        value={newHabit.target}
                        onChange={e => setNewHabit({ ...newHabit, target: e.target.value })}
                        style={{ width: '96px' }}
                        min="1"
                      />
                      <input
                        type="text"
                        placeholder="Unit (e.g., glasses)"
                        value={newHabit.unit}
                        onChange={e => setNewHabit({ ...newHabit, unit: e.target.value })}
                        style={{ flex: 1 }}
                      />
                    </div>
                  )}
                  
                  <button
                    onClick={addHabit}
                    disabled={!newHabit.name.trim()}
                    className="submit-btn"
                  >
                    追加する
                  </button>
                </div>
              </div>
            </div>
          )}
          
          {/* Sync Modal */}
          {showSync && (
            <div className="modal-overlay" onClick={() => setShowSync(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ padding: '26px', display: 'flex', flexDirection: 'column', gap: '18px' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div>
                    <p style={{ fontSize: '11px', color: '#ff6b9d', letterSpacing: '0.2em', marginBottom: '6px', opacity: 0.8 }}>同期</p>
                    <h2 style={{ fontSize: '22px', fontWeight: 900, color: '#f5e6d3', letterSpacing: '-0.02em' }}>Sync devices</h2>
                  </div>
                  <button onClick={() => setShowSync(false)} className="icon-btn">
                    <Icon name="x" size={24} />
                  </button>
                </div>
                
                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    <span style={{ fontSize: '12px', color: '#c9a0b0' }}>Share this link with your phone or desktop to copy the same data.</span>
                    <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                      <input
                        type="text"
                        value={shareLink}
                        readOnly
                        style={{ flex: 1, minWidth: '200px' }}
                      />
                      <button
                        onClick={copyShareLink}
                        className="submit-btn"
                        style={{ padding: '12px 18px', whiteSpace: 'nowrap' }}
                      >
                        Copy link
                      </button>
                    </div>
                    {copyStatus && (
                      <p className="mono" style={{ fontSize: '11px', color: '#8a7080' }}>{copyStatus}</p>
                    )}
                  </div>
                  
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    <span style={{ fontSize: '12px', color: '#c9a0b0' }}>Paste a sync link or token from another device to import its data.</span>
                    <input
                      type="text"
                      placeholder="Paste sync link or token"
                      value={importValue}
                      onChange={e => { setImportValue(e.target.value); setImportError(''); }}
                      style={{ width: '100%' }}
                    />
                    {importError && (
                      <p className="mono" style={{ fontSize: '11px', color: '#ff6b9d' }}>{importError}</p>
                    )}
                    <button
                      onClick={importSharedInput}
                      disabled={!importValue.trim()}
                      className="submit-btn"
                    >
                      Import data
                    </button>
                  </div>
                </div>
                
                <p style={{ fontSize: '11px', color: '#6a5060', lineHeight: 1.6, marginTop: '4px' }}>
                  Data stays in your browser unless you share it. To refresh an older device, open the copied link there.
                </p>
              </div>
            </div>
          )}
          
          {/* Floating Add Button */}
          <button onClick={() => setShowAddHabit(true)} className="add-btn">
            <Icon name="plus" size={28} />
          </button>
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<HabitTracker />);
  </script>
</body>
</html>
