<!-- ABOUTME: Renders the Habits single-page tracker UI with inlined React and styling. -->
<!-- ABOUTME: Provides storage, navigation, and interaction for habit tracking on web and PWA. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>習慣 | Habits</title>
  <meta name="description" content="Simple habit tracker with streaks">
  <meta name="theme-color" content="#1a1520">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/kowloon-romance.svg">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+1+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg,
        #1a1520 0%,
        #2d1f35 30%,
        #3d2847 60%,
        #4a2f52 100%
      );
      background-attachment: fixed;
      color: #f5e6d3;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }

    .page-shell {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 20px 96px;
      max-width: 960px;
      margin: 0 auto;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(255, 107, 157, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 183, 77, 0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    .mono {
      font-family: 'M PLUS 1 Code', monospace;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      z-index: 1;
    }

    .header-panel {
      background: radial-gradient(circle at 20% 20%, rgba(255, 107, 157, 0.15), transparent 50%),
        radial-gradient(circle at 80% 0%, rgba(0, 212, 255, 0.12), transparent 45%),
        linear-gradient(145deg, rgba(45, 31, 53, 0.9), rgba(26, 21, 32, 0.85));
      border: 1px solid rgba(255, 107, 157, 0.2);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow:
        0 16px 50px rgba(0, 0, 0, 0.35),
        0 0 40px rgba(255, 107, 157, 0.08);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .header-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 183, 77, 0.12), rgba(0, 212, 255, 0.05));
      opacity: 0.7;
      pointer-events: none;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .nav-shell {
      padding: 10px;
      background: rgba(26, 21, 32, 0.65);
      border-radius: 14px;
      border: 1px solid rgba(255, 107, 157, 0.15);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .habit-card {
      background: linear-gradient(145deg,
        rgba(58, 42, 68, 0.82),
        rgba(26, 21, 32, 0.92)
      );
      border: 1px solid rgba(255, 107, 157, 0.18);
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .habit-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(255, 107, 157, 0.3),
        rgba(0, 212, 255, 0.2),
        transparent
      );
    }

    .habit-card:hover {
      border-color: rgba(255, 107, 157, 0.35);
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(255, 107, 157, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .streak-number {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ff6b9d, #ffb74d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .streak-glow {
      filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6)); }
      50% { filter: drop-shadow(0 0 15px rgba(255, 107, 157, 0.8)); }
    }

    .neon-text {
      color: #ff6b9d;
      text-shadow:
        0 0 5px rgba(255, 107, 157, 0.5),
        0 0 10px rgba(255, 107, 157, 0.3),
        0 0 20px rgba(255, 107, 157, 0.2);
    }

    .checkbox-custom {
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255, 107, 157, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      background: rgba(26, 21, 32, 0.5);
    }

    .checkbox-custom.checked {
      background: linear-gradient(135deg, #ff6b9d, #ff8a80);
      border-color: #ff6b9d;
      box-shadow: 0 0 15px rgba(255, 107, 157, 0.4);
    }

    .checkbox-custom:hover {
      border-color: #ff6b9d;
      box-shadow: 0 0 10px rgba(255, 107, 157, 0.3);
    }

    .amount-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 107, 157, 0.1);
      border: 1px solid rgba(255, 107, 157, 0.3);
      color: #ff6b9d;
    }

    .amount-btn:hover {
      background: rgba(255, 107, 157, 0.2);
      box-shadow: 0 0 12px rgba(255, 107, 157, 0.3);
    }

    .amount-btn:active {
      transform: scale(0.95);
    }

    .nav-btn {
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      transition: all 0.2s ease;
      font-size: 13px;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #ff6b9d, #ff8a80);
      color: #1a1520;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.35);
    }

    .nav-btn:not(.active) {
      background: rgba(255, 107, 157, 0.08);
      color: #c9a0b0;
      border: 1px solid rgba(255, 107, 157, 0.15);
    }

    .nav-btn:not(.active):hover {
      color: #f5e6d3;
      background: rgba(255, 107, 157, 0.15);
      border-color: rgba(255, 107, 157, 0.25);
    }

    .mini-bar {
      height: 24px;
      border-radius: 3px;
      transition: all 0.2s ease;
      background: rgba(255, 107, 157, 0.1);
      position: relative;
      overflow: hidden;
    }

    .mini-bar-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #ff6b9d, #ff8a80);
      transition: height 0.3s ease;
      box-shadow: 0 0 8px rgba(255, 107, 157, 0.4);
    }

    input, select {
      background: rgba(26, 21, 32, 0.8);
      border: 1px solid rgba(255, 107, 157, 0.2);
      border-radius: 10px;
      padding: 14px 18px;
      color: #f5e6d3;
      font-family: 'M PLUS 1 Code', monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: rgba(255, 107, 157, 0.5);
      box-shadow: 0 0 15px rgba(255, 107, 157, 0.15);
    }

    input::placeholder {
      color: #8a7080;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 15, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: linear-gradient(180deg, #2d1f35 0%, #1a1520 100%);
      width: 100%;
      max-width: 32rem;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      border: 1px solid rgba(255, 107, 157, 0.15);
      border-bottom: none;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    }

    .add-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b9d, #ff8a80);
      color: #1a1520;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow:
        0 8px 25px rgba(255, 107, 157, 0.4),
        0 0 30px rgba(255, 107, 157, 0.2);
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      transform: scale(1.08);
      box-shadow:
        0 12px 35px rgba(255, 107, 157, 0.5),
        0 0 40px rgba(255, 107, 157, 0.3);
    }

    .type-btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .type-btn.active {
      background: linear-gradient(135deg, #ff6b9d, #ff8a80);
      color: #1a1520;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
    }

    .type-btn:not(.active) {
      background: rgba(255, 107, 157, 0.1);
      color: #c9a0b0;
      border: 1px solid rgba(255, 107, 157, 0.15);
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6b9d, #ff8a80);
      color: #1a1520;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 107, 157, 0.3);
    }

    .submit-btn:hover {
      box-shadow: 0 6px 25px rgba(255, 107, 157, 0.45);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #6a5060;
      cursor: pointer;
      padding: 4px;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      color: #ff6b9d;
      filter: drop-shadow(0 0 5px rgba(255, 107, 157, 0.5));
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8a7080;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .icon-btn:hover {
      color: #f5e6d3;
    }

    .title-jp {
      font-size: 11px;
      color: #ff6b9d;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const STORAGE_KEY = 'habit-tracker-data';
    
    // Simple icon components using Lucide
    const Icon = ({ name, size = 24, className = '' }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          const icon = lucide.icons[name];
          if (icon) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            svg.innerHTML = icon[2];
            ref.current.appendChild(svg);
          }
        }
      }, [name, size]);
      return <span ref={ref} className={className} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
    };
    
    const getDateKey = (date = new Date()) => {
      return date.toISOString().split('T')[0];
    };
    
    const getDaysAgo = (n) => {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return getDateKey(d);
    };
    
    const formatDate = (dateKey) => {
      const date = new Date(dateKey + 'T12:00:00');
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    };
    
    const loadData = () => {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
          return JSON.parse(data);
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
      return { habits: [], logs: {} };
    };
    
    const saveData = (data) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error('Failed to save data:', e);
      }
    };
    
    function HabitTracker() {
      const [data, setData] = useState(() => loadData());
      const [view, setView] = useState('today');
      const [showAddHabit, setShowAddHabit] = useState(false);
      const [newHabit, setNewHabit] = useState({ name: '', type: 'checkbox', target: 1, unit: '' });
      
      const { habits, logs } = data;
      const today = getDateKey();
      
      useEffect(() => {
        saveData(data);
      }, [data]);
      
      const updateData = (updater) => {
        setData(prev => {
          const next = updater(prev);
          return next;
        });
      };
      
      const calculateStreak = (habitId) => {
        let streak = 0;
        let checkDate = new Date();
        
        const habit = habits.find(h => h.id === habitId);
        if (!habit) return 0;
        
        const isComplete = (log) => {
          if (!log) return false;
          if (habit.type === 'checkbox') return log.done;
          return (log.value || 0) >= habit.target;
        };
        
        const todayLog = logs[today]?.[habitId];
        if (!isComplete(todayLog)) {
          checkDate.setDate(checkDate.getDate() - 1);
        }
        
        while (true) {
          const dateKey = getDateKey(checkDate);
          const log = logs[dateKey]?.[habitId];
          
          if (isComplete(log)) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
          
          if (streak > 365) break;
        }
        
        return streak;
      };
      
      const addHabit = () => {
        if (!newHabit.name.trim()) return;
        
        const habit = {
          id: Date.now().toString(),
          name: newHabit.name.trim(),
          type: newHabit.type,
          target: newHabit.type === 'amount' ? Number(newHabit.target) || 1 : 1,
          unit: newHabit.type === 'amount' ? newHabit.unit.trim() : '',
          createdAt: today
        };
        
        updateData(prev => ({
          ...prev,
          habits: [...prev.habits, habit]
        }));
        
        setNewHabit({ name: '', type: 'checkbox', target: 1, unit: '' });
        setShowAddHabit(false);
      };
      
      const deleteHabit = (habitId) => {
        updateData(prev => ({
          ...prev,
          habits: prev.habits.filter(h => h.id !== habitId)
        }));
      };
      
      const toggleCheckbox = (habitId, dateKey = today) => {
        updateData(prev => ({
          ...prev,
          logs: {
            ...prev.logs,
            [dateKey]: {
              ...prev.logs[dateKey],
              [habitId]: {
                ...prev.logs[dateKey]?.[habitId],
                done: !prev.logs[dateKey]?.[habitId]?.done
              }
            }
          }
        }));
      };
      
      const updateAmount = (habitId, delta, dateKey = today) => {
        updateData(prev => {
          const currentValue = prev.logs[dateKey]?.[habitId]?.value || 0;
          const newValue = Math.max(0, currentValue + delta);
          return {
            ...prev,
            logs: {
              ...prev.logs,
              [dateKey]: {
                ...prev.logs[dateKey],
                [habitId]: {
                  ...prev.logs[dateKey]?.[habitId],
                  value: newValue
                }
              }
            }
          };
        });
      };
      
      const getCompletionRate = (habitId, days = 30) => {
        const habit = habits.find(h => h.id === habitId);
        if (!habit) return 0;
        
        let completed = 0;
        let total = 0;
        
        for (let i = 0; i < days; i++) {
          const dateKey = getDaysAgo(i);
          if (dateKey < habit.createdAt) break;
          
          total++;
          const log = logs[dateKey]?.[habitId];
          
          if (habit.type === 'checkbox' && log?.done) completed++;
          if (habit.type === 'amount' && (log?.value || 0) >= habit.target) completed++;
        }
        
        return total > 0 ? Math.round((completed / total) * 100) : 0;
      };
      
      const getLast7Days = () => {
        return Array.from({ length: 7 }, (_, i) => getDaysAgo(6 - i));
      };
      
      return (
        <div className="page-shell">
          {/* Header */}
          <div className="header-panel" style={{ marginBottom: '28px' }}>
            <div className="header-content">
              <p className="title-jp" style={{ marginBottom: '10px' }}>習慣トラッカー</p>
              <h1 style={{
                fontSize: '38px',
                fontWeight: 900,
                background: 'linear-gradient(135deg, #ff6b9d, #ffb74d, #00d4ff)',
                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent',
                backgroundClip: 'text',
                letterSpacing: '-0.03em',
                textShadow: '0 6px 30px rgba(0, 0, 0, 0.35)'
              }}>Habits</h1>
              <p className="mono" style={{ color: '#c9a0b0', fontSize: '13px', marginTop: '12px', letterSpacing: '0.04em' }}>{formatDate(today)}</p>
            </div>
          </div>
          
          {/* Navigation */}
          <div style={{ marginBottom: '32px' }}>
            <div className="nav-shell" style={{ display: 'flex', gap: '8px' }}>
              <button 
                onClick={() => setView('today')} 
                className={`nav-btn ${view === 'today' ? 'active' : ''}`}
                style={{ flex: 1 }}
              >
                <Icon name="check" size={16} /> Today
              </button>
              <button 
                onClick={() => setView('history')} 
                className={`nav-btn ${view === 'history' ? 'active' : ''}`}
                style={{ flex: 1 }}
              >
                <Icon name="trending-up" size={16} /> Trends
              </button>
            </div>
          </div>
          
          {/* Today View */}
          {view === 'today' && (
            <div className="card-stack">
              {habits.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '64px 0', color: '#8a7080' }}>
                  <div style={{ color: '#ff6b9d', opacity: 0.4, marginBottom: '16px' }}>
                    <Icon name="calendar" size={48} />
                  </div>
                  <p style={{ fontSize: '15px', fontWeight: 500 }}>まだ習慣がありません</p>
                  <p style={{ fontSize: '12px', marginTop: '6px', color: '#6a5060' }}>Add one to get started</p>
                </div>
              ) : (
                habits.map(habit => {
                  const streak = calculateStreak(habit.id);
                  const log = logs[today]?.[habit.id];
                  const isComplete = habit.type === 'checkbox' 
                    ? log?.done 
                    : (log?.value || 0) >= habit.target;
                  
                  return (
                    <div key={habit.id} className="habit-card" style={{ borderRadius: '16px', padding: '20px 24px' }}>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                            <h3 style={{
                              fontWeight: 700,
                              fontSize: '16px',
                              color: isComplete ? '#ff6b9d' : '#f5e6d3',
                              overflow: 'hidden',
                              textOverflow: 'ellipsis',
                              whiteSpace: 'nowrap',
                              letterSpacing: '-0.01em',
                              textShadow: isComplete ? '0 0 20px rgba(255, 107, 157, 0.3)' : 'none'
                            }}>
                              {habit.name}
                            </h3>
                            {streak > 0 && (
                              <div style={{ display: 'flex', alignItems: 'center', gap: '6px', color: '#ff6b9d', flexShrink: 0 }}>
                                <span className={streak >= 7 ? 'streak-glow' : ''}>
                                  <Icon name="flame" size={18} />
                                </span>
                                <span className="streak-number">{streak}</span>
                              </div>
                            )}
                          </div>
                          {habit.type === 'amount' && (
                            <p className="mono" style={{ fontSize: '12px', color: '#8a7080', marginTop: '6px', letterSpacing: '0.02em' }}>
                              {log?.value || 0} / {habit.target} {habit.unit}
                            </p>
                          )}
                        </div>
                        
                        <div style={{ display: 'flex', alignItems: 'center', gap: '16px', marginLeft: '16px' }}>
                          {habit.type === 'checkbox' ? (
                            <div 
                              onClick={() => toggleCheckbox(habit.id)}
                              className={`checkbox-custom ${log?.done ? 'checked' : ''}`}
                            >
                              {log?.done && <Icon name="check" size={18} />}
                            </div>
                          ) : (
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                              <button 
                                onClick={() => updateAmount(habit.id, -1)}
                                className="amount-btn"
                              >
                                <Icon name="minus" size={16} />
                              </button>
                              <span className="mono" style={{
                                width: '40px',
                                textAlign: 'center',
                                fontWeight: 600,
                                fontSize: '18px',
                                color: isComplete ? '#ff6b9d' : '#c9a0b0',
                                textShadow: isComplete ? '0 0 10px rgba(255, 107, 157, 0.4)' : 'none'
                              }}>
                                {log?.value || 0}
                              </span>
                              <button 
                                onClick={() => updateAmount(habit.id, 1)}
                                className="amount-btn"
                              >
                                <Icon name="plus" size={16} />
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
          
          {/* History/Trends View */}
          {view === 'history' && (
            <div className="card-stack" style={{ gap: '20px' }}>
              {habits.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '64px 0', color: '#8a7080' }}>
                  <div style={{ color: '#ff6b9d', opacity: 0.4, marginBottom: '16px' }}>
                    <Icon name="trending-up" size={48} />
                  </div>
                  <p style={{ fontSize: '14px' }}>データがまだありません</p>
                </div>
              ) : (
                habits.map(habit => {
                  const streak = calculateStreak(habit.id);
                  const rate = getCompletionRate(habit.id);
                  const last7 = getLast7Days();
                  
                  return (
                    <div key={habit.id} className="habit-card" style={{ borderRadius: '16px', padding: '24px' }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '20px' }}>
                        <div>
                          <h3 style={{ fontWeight: 700, fontSize: '16px', color: '#f5e6d3', letterSpacing: '-0.01em' }}>{habit.name}</h3>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '20px', marginTop: '12px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', color: '#ff6b9d' }}>
                              <Icon name="flame" size={18} />
                              <span className="streak-number" style={{ fontSize: '26px' }}>{streak}</span>
                              <span style={{ fontSize: '13px', color: '#c9a0b0', marginLeft: '2px' }}>日連続</span>
                            </div>
                            <div className="mono" style={{ fontSize: '13px', color: '#8a7080', letterSpacing: '0.02em' }}>
                              {rate}% <span style={{ opacity: 0.7 }}>30日</span>
                            </div>
                          </div>
                        </div>
                        <button
                          onClick={() => deleteHabit(habit.id)}
                          className="delete-btn"
                        >
                          <Icon name="trash-2" size={18} />
                        </button>
                      </div>
                      
                      {/* Mini chart */}
                      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: '6px', height: '40px' }}>
                        {last7.map(dateKey => {
                          const log = logs[dateKey]?.[habit.id];
                          let fillPercent = 0;
                          
                          if (habit.type === 'checkbox') {
                            fillPercent = log?.done ? 100 : 0;
                          } else {
                            fillPercent = Math.min(100, ((log?.value || 0) / habit.target) * 100);
                          }
                          
                          const isToday = dateKey === today;
                          
                          return (
                            <div key={dateKey} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px' }}>
                              <div className="mini-bar" style={{ width: '100%', height: '28px', borderRadius: '4px' }}>
                                <div className="mini-bar-fill" style={{ height: `${fillPercent}%`, borderRadius: '4px' }} />
                              </div>
                              <span className="mono" style={{ fontSize: '10px', color: isToday ? '#ff6b9d' : '#6a5060', fontWeight: isToday ? 600 : 400 }}>
                                {new Date(dateKey + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'narrow' })}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
          
          {/* Add Habit Modal */}
          {showAddHabit && (
            <div className="modal-overlay" onClick={() => setShowAddHabit(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ padding: '28px' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
                  <div>
                    <p style={{ fontSize: '11px', color: '#ff6b9d', letterSpacing: '0.2em', marginBottom: '6px', opacity: 0.8 }}>新しい習慣</p>
                    <h2 style={{ fontSize: '22px', fontWeight: 900, color: '#f5e6d3', letterSpacing: '-0.02em' }}>New Habit</h2>
                  </div>
                  <button onClick={() => setShowAddHabit(false)} className="icon-btn">
                    <Icon name="x" size={24} />
                  </button>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <input
                    type="text"
                    placeholder="Habit name"
                    value={newHabit.name}
                    onChange={e => setNewHabit({ ...newHabit, name: e.target.value })}
                    style={{ width: '100%' }}
                    autoFocus
                  />
                  
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button
                      onClick={() => setNewHabit({ ...newHabit, type: 'checkbox' })}
                      className={`type-btn ${newHabit.type === 'checkbox' ? 'active' : ''}`}
                    >
                      Checkbox
                    </button>
                    <button
                      onClick={() => setNewHabit({ ...newHabit, type: 'amount' })}
                      className={`type-btn ${newHabit.type === 'amount' ? 'active' : ''}`}
                    >
                      Amount
                    </button>
                  </div>
                  
                  {newHabit.type === 'amount' && (
                    <div style={{ display: 'flex', gap: '12px' }}>
                      <input
                        type="number"
                        placeholder="Target"
                        value={newHabit.target}
                        onChange={e => setNewHabit({ ...newHabit, target: e.target.value })}
                        style={{ width: '96px' }}
                        min="1"
                      />
                      <input
                        type="text"
                        placeholder="Unit (e.g., glasses)"
                        value={newHabit.unit}
                        onChange={e => setNewHabit({ ...newHabit, unit: e.target.value })}
                        style={{ flex: 1 }}
                      />
                    </div>
                  )}
                  
                  <button
                    onClick={addHabit}
                    disabled={!newHabit.name.trim()}
                    className="submit-btn"
                  >
                    追加する
                  </button>
                </div>
              </div>
            </div>
          )}
          
          {/* Floating Add Button */}
          <button onClick={() => setShowAddHabit(true)} className="add-btn">
            <Icon name="plus" size={28} />
          </button>
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<HabitTracker />);
  </script>
</body>
</html>
